#=============================================================================
# Alacritty Configuration - Managed by Theme Switcher
#=============================================================================

[general]
# This points to the file being overwritten by your theme-switcher.sh
import = ["~/.config/alacritty/alacritty-theme.toml"]

[env]
TERM = "xterm-256color"

[window]
# 0.85 opacity provides the 'glass' look seen in your references
opacity = 0.85
blur = true
dynamic_title = true
decorations = "none"

[window.class]
instance = "Alacritty"
general = "Alacritty"

[font]
size = 11.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 6

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/fish"

# IMPORTANT: Ensure NO [colors] section exists below this line.
# If hardcoded colors are here, they will overwrite your theme-switcher colors.
